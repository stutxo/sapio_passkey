[package]
name = "sapio-passkey-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MPL-2.0"
publish = false
description = "A public-only BDK wallet with Sapio TEE passkey authorization"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bitcoin = { version = "=0.32.102", features = ["serde"] }
bdk_wallet = "=3.1.0"
hex = "0.4"
miniscript = { version = "=13.1.0", features = ["compiler", "serde"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
sapio-base = { git = "https://github.com/stutxo/sapio", rev = "c8f4e63123e724dc1144075af8ac0dbd3cf4e0b1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bdk_esplora = { version = "=0.22.2", default-features = false, features = ["async"] }
esplora-client = { version = "=0.12.3", default-features = false, features = ["async"] }
futures-channel = "0.3"
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "=0.3.91"
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
web-sys = { version = "=0.3.91", features = ["Window", "Url"] }
